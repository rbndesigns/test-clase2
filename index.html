<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F1D33" />
  <title>HA Basket — Resultados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#0F1D33; --navy-soft:#172944; --yellow:#F7D10C; --paper:#f4f6fa; --white:#fff; --ink:#142238; --muted:#718096; --border:#e5e9f0; --green:#087443; --red:#b42318; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; color:var(--ink); background:var(--paper); font-family:Barlow,Arial,sans-serif; }
    .site-header { background:var(--navy); color:var(--white); }
    .header-inner, main, footer { width:min(1180px,100%); margin:auto; padding-left:clamp(20px,5vw,72px); padding-right:clamp(20px,5vw,72px); }
    .header-inner { min-height:82px; display:flex; justify-content:space-between; align-items:center; gap:20px; }
    .brand { display:flex; align-items:center; gap:12px; color:var(--white); text-decoration:none; font:25px 'Bebas Neue',sans-serif; letter-spacing:1.5px; }
    .club-crest { width:44px; height:44px; flex:none; object-fit:contain; }
    .brand-name { display:block; line-height:.9; }
    .brand-name small { display:block; margin-top:6px; color:#c5cfdd; font:600 9px Barlow,sans-serif; letter-spacing:2.4px; }
    .brand-name .highlight { color:var(--yellow); }
    nav { display:flex; gap:18px; flex-wrap:wrap; align-items:center; }
    nav a { padding:10px 15px; border:1px solid #ffffff32; border-radius:999px; color:var(--white); text-decoration:none; font:700 12px 'Barlow Condensed',sans-serif; letter-spacing:1px; text-transform:uppercase; transition:background .2s,border-color .2s; }
    nav a:hover { border-color:var(--yellow); background:#ffffff0c; }
    .section-label { color:var(--muted); font:700 11px 'Barlow Condensed',sans-serif; letter-spacing:2.5px; text-transform:uppercase; }
    main { padding-top:40px; padding-bottom:60px; }
    .summary { margin-bottom:20px; display:flex; justify-content:space-between; align-items:end; gap:20px; }
    .summary-copy .section-label { color:#6c7a8d; }
    h2 { margin-top:5px; color:var(--navy); font:36px/1 'Bebas Neue',sans-serif; letter-spacing:.5px; }
    .stats { margin-top:7px; color:var(--muted); font-size:14px; }
    .filter-label { width:min(280px,100%); }
    .filter-label > .section-label { display:block; margin-bottom:7px; }
    .team-filter { position:relative; }
    .filter-trigger { width:100%; min-height:48px; padding:7px 13px; display:flex; align-items:center; gap:11px; border:1px solid var(--border); border-radius:10px; color:var(--navy); background:var(--white); box-shadow:0 4px 14px #0f1d3308; font:600 14px Barlow,sans-serif; text-align:left; cursor:pointer; list-style:none; }
    .filter-trigger::-webkit-details-marker { display:none; }
    .filter-trigger::after { content:'⌄'; margin-left:auto; color:var(--muted); font-size:18px; }
    .filter-trigger:focus-visible, .filter-option:focus-visible { outline:3px solid #315ca8; outline-offset:2px; }
    .filter-trigger .club-crest { width:30px; height:30px; }
    .filter-menu { position:absolute; z-index:5; top:calc(100% + 7px); left:0; right:0; max-height:280px; overflow:auto; padding:5px; border:1px solid var(--border); border-radius:10px; background:var(--white); box-shadow:0 14px 34px #0f1d3326; }
    .team-filter:not([open]) .filter-menu { display:none; }
    .filter-option { width:100%; padding:8px 9px; display:flex; align-items:center; gap:10px; border:0; border-radius:7px; color:var(--navy); background:var(--white); font:600 14px Barlow,sans-serif; text-align:left; cursor:pointer; }
    .filter-option:hover, .filter-option[aria-selected="true"] { background:#f2f5f9; }
    .filter-option .club-crest { width:28px; height:28px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .result { position:relative; overflow:hidden; border:1px solid var(--border); border-radius:15px; background:var(--white); box-shadow:0 5px 18px #162b4610; animation:appear .35s both; transition:transform .2s,box-shadow .2s; }
    .result:hover { transform:translateY(-3px); box-shadow:0 12px 28px #162b4618; }
    .result::before { position:absolute; inset:0 auto 0 0; width:4px; background:var(--yellow); content:""; }
    .result-top { min-height:66px; padding:13px 17px 12px 21px; display:flex; justify-content:space-between; align-items:center; gap:12px; border-bottom:1px solid #edf0f4; }
    .competition { min-width:0; }
    .category { color:#778397; font:700 10px 'Barlow Condensed',sans-serif; letter-spacing:1.1px; line-height:1.3; text-transform:uppercase; }
    .round { margin-top:4px; color:var(--navy); font:700 14px 'Barlow Condensed',sans-serif; }
    .date { flex:none; padding:6px 9px; border-radius:6px; color:#5c6879; background:#f2f4f7; font:700 11px 'Barlow Condensed',sans-serif; letter-spacing:.4px; }
    .match { min-height:118px; padding:18px 18px 15px 21px; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:10px; }
    .team-block { min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; }
    .team-name { min-width:0; color:var(--navy); font:700 16px/1.15 'Barlow Condensed',sans-serif; overflow-wrap:anywhere; }
    .team-side { display:block; margin-top:4px; color:#8994a4; font:600 9px Barlow,sans-serif; letter-spacing:1px; text-transform:uppercase; }
    .team-logo { width:70px; height:70px; flex:none; padding:4px; object-fit:contain; border:1px solid #edf0f4; border-radius:16px; background:var(--white); }
    .scoreboard { min-width:87px; text-align:center; }
    .final-label { display:block; margin-bottom:6px; color:#9aa4b2; font:700 9px 'Barlow Condensed',sans-serif; letter-spacing:1.8px; }
    .score { display:flex; align-items:center; justify-content:center; gap:7px; color:var(--navy); font:700 27px/1 'Barlow Condensed',sans-serif; white-space:nowrap; }
    .colon { color:#a8b1bd; font-size:18px; }
    .result-bottom { min-height:43px; padding:9px 18px 10px 21px; display:flex; justify-content:space-between; align-items:center; gap:10px; border-top:1px solid #edf0f4; }
    .badge { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font:700 10px 'Barlow Condensed',sans-serif; letter-spacing:1px; text-transform:uppercase; }
    .badge::before { width:7px; height:7px; border-radius:50%; background:#a8b1bd; content:""; }
    .badge.victoria { color:var(--green); }
    .badge.victoria::before { background:var(--green); }
    .badge.derrota { color:var(--red); }
    .badge.derrota::before { background:var(--red); }
    .badge.empate { color:#805b00; }
    .badge.empate::before { background:#c18b00; }
    .result-hint { color:#9aa4b2; font:600 10px 'Barlow Condensed',sans-serif; letter-spacing:.6px; text-transform:uppercase; }
    .empty { grid-column:1/-1; padding:42px 20px; border:1px dashed #cfd6e0; border-radius:15px; color:var(--muted); background:#ffffff9e; text-align:center; }
    footer { padding-top:18px; padding-bottom:24px; display:flex; justify-content:space-between; gap:16px; border-top:1px solid #e1e6ee; color:var(--muted); font-size:12px; }
    @keyframes appear { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @media(max-width:760px) { .grid { grid-template-columns:1fr; } }
    @media(max-width:560px) { .header-inner { min-height:72px; } nav a { padding:9px 11px; font-size:10px; } .brand { font-size:22px; } .club-crest { width:38px; height:38px; } main { padding-top:32px; } .summary { align-items:stretch; flex-direction:column; gap:18px; } .filter-label { width:100%; } h2 { font-size:32px; } .grid { gap:12px; } .result-top { min-height:62px; padding:11px 12px 10px 16px; } .category { font-size:9px; } .match { min-height:145px; gap:5px; padding:14px 10px 12px 15px; } .team-name { font-size:15px; } .team-side { font-size:8px; } .team-logo { width:58px; height:58px; padding:3px; border-radius:13px; } .scoreboard { min-width:70px; } .score { gap:4px; font-size:23px; } .final-label { margin-bottom:5px; font-size:8px; } .result-bottom { min-height:39px; padding:8px 12px 9px 16px; } footer { flex-direction:column; } }
    @media(max-width:370px) { .match { grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr); } .team-name { font-size:13px; } .team-logo { width:50px; height:50px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
    <a class="brand" href="./" aria-label="HA Basket, inicio"><img class="club-crest" src="https://www.fbm.es/imagenes/clubes/20677/logo.jpg" alt=""><span class="brand-name">HA <span class="highlight">BASKET</span><small>HIGHSTEP ACADEMY</small></span></a>
    <nav aria-label="Fuente de resultados">
      <a href="https://www.fbm.es/resultados-club-20677/highstep-academy" target="_blank" rel="noopener noreferrer">Resultados FBM <span aria-hidden="true">↗</span></a>
    </nav>
    </div>
  </header>
  <main>
    <div class="summary">
      <div class="summary-copy">
        <div class="section-label">La temporada, jornada a jornada</div>
        <h2>Marcadores oficiales</h2>
        <div class="stats" id="conteo" aria-live="polite">Cargando resultados…</div>
      </div>
      <label class="filter-label">
        <span class="section-label">Filtrar por equipo</span>
        <details class="team-filter" id="filtro-equipo">
          <summary class="filter-trigger" aria-label="Filtrar por equipo"><img class="club-crest" src="https://www.fbm.es/imagenes/clubes/20677/logo.jpg" alt=""><span id="equipo-seleccionado">Todos los equipos</span></summary>
          <div class="filter-menu" id="opciones-equipo" role="listbox" aria-label="Equipos"></div>
        </details>
      </label>
    </div>
    <div class="grid" id="resultados" aria-live="polite"></div>
  </main>
  <footer>
    <span>HA Basket · Highstep Academy · Madrid</span>
    <span><span id="updated"></span> · Marcadores de FBM</span>
  </footer>
  <script>
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const dateSort = (value) => { const [d,m,y] = value.split('/').map(Number); return new Date(y,m-1,d).getTime(); };
    const escudosFBM = {
      'HA BASKET': '20677', 'HA BASKET "A"': '20677', 'LOS NEGRALES´22': '20674',
      'YELMO TEAM C.D.E.': '20678', 'COLMENAR VIEJO C': '6881', 'REVOLUTION': '16063',
      'PSB PIRATAS': '13330', 'BALONCESTO DAGANZO 12 ISUZU REVEIN': '17760',
      'BALONCESTO SAN FERNANDO': '6283', 'VALLEKAS BASKET C': '20525', 'CDEBSMV NEGRO': '19201',
      'TRIPLE CHAMBERI': '20012', 'VILLAVICIOSA DE ODON A.B.': '6337', 'ONDA VERDE': '12493'
    };
    const escudoEquipo = (result, side) => result[`escudo${side}`]
      || (escudosFBM[result[side === 'Local' ? 'equipoLocal' : 'equipoVisitante']]
        ? `https://www.fbm.es/imagenes/clubes/${escudosFBM[result[side === 'Local' ? 'equipoLocal' : 'equipoVisitante']]}/logo.jpg`
        : '');
    const equipoFilterKey = (result) => JSON.stringify([result.equipoHA, result.categoria]);
    function equipoFilterLabel(result) {
      const category = result.categoria || '';
      const level = /^(Junior|Cadete|Infantil)/i.exec(category)?.[1]
        || (/^2ª\s*Div/i.test(category) ? 'Senior' : category);
      return `${result.equipoHA} · ${level}`;
    }

    function card(result, index) {
      const logo = (src, name) => src ? `<img class="team-logo" src="${esc(src)}" alt="Escudo de ${esc(name)}" loading="lazy" onerror="this.hidden=true">` : '';
      return `<article class="result" style="animation-delay:${Math.min(index,12)*35}ms">
        <div class="result-top"><div class="competition"><div class="category">${esc(result.categoria)}</div><div class="round">${esc(result.jornada || 'Jornada')}</div></div><time class="date">${esc(result.fecha)}</time></div>
        <div class="match"><div class="team-block local">${logo(escudoEquipo(result,'Local'),result.equipoLocal)}<span class="team-name">${esc(result.equipoLocal)}<small class="team-side">Local</small></span></div><div class="scoreboard"><span class="final-label">FINAL</span><div class="score"><span>${esc(result.puntosLocal)}</span><span class="colon">:</span><span>${esc(result.puntosVisitante)}</span></div></div><div class="team-block visitor">${logo(escudoEquipo(result,'Visitante'),result.equipoVisitante)}<span class="team-name">${esc(result.equipoVisitante)}<small class="team-side">Visitante</small></span></div></div>
        <div class="result-bottom"><span class="badge ${esc(result.balance)}">${esc(result.equipoHA)} · ${esc(result.balance)}</span><span class="result-hint">Marcador final</span></div>
      </article>`;
    }

    async function cargar() {
      const grid = document.getElementById('resultados');
      const conteo = document.getElementById('conteo');
      try {
        const response = await fetch('./public/resultados.json?t=' + Date.now());
        if (!response.ok) throw new Error('No se pudo leer el archivo de resultados.');
        const data = await response.json();
        const resultados = [...(data.resultados || [])].sort((a,b) => dateSort(b.fecha) - dateSort(a.fecha));
        const equipos = [...new Map(resultados.map(result => [
          equipoFilterKey(result),
          { value: equipoFilterKey(result), label: equipoFilterLabel(result) }
        ])).values()].sort((a,b) => a.label.localeCompare(b.label,'es'));
        const filtro = document.getElementById('filtro-equipo');
        const opciones = document.getElementById('opciones-equipo');
        const etiquetaSeleccionada = document.getElementById('equipo-seleccionado');
        const escudo = 'https://www.fbm.es/imagenes/clubes/20677/logo.jpg';
        const opcionesFiltro = [{value:'', label:'Todos los equipos'}, ...equipos];
        opciones.innerHTML = opcionesFiltro.map(equipo => `<button class="filter-option" type="button" role="option" aria-selected="${equipo.value === ''}" data-value="${esc(equipo.value)}"><img class="club-crest" src="${escudo}" alt=""><span>${esc(equipo.label)}</span></button>`).join('');
        let valorFiltro = '';
        opciones.addEventListener('click', event => {
          const opcion = event.target.closest('.filter-option');
          if (!opcion) return;
          valorFiltro = opcion.dataset.value;
          etiquetaSeleccionada.textContent = opcionesFiltro.find(equipo => equipo.value === valorFiltro)?.label || 'Todos los equipos';
          opciones.querySelectorAll('.filter-option').forEach(item => item.setAttribute('aria-selected', String(item === opcion)));
          filtro.open = false;
          mostrar();
        });
        document.addEventListener('click', event => { if (!filtro.contains(event.target)) filtro.open = false; });
        filtro.addEventListener('keydown', event => {
          if (event.key === 'Escape') { filtro.open = false; filtro.querySelector('summary').focus(); }
        });

        const mostrar = () => {
          const elegidos = resultados.filter(r => !valorFiltro || equipoFilterKey(r) === valorFiltro);
          conteo.textContent = `${elegidos.length} resultado${elegidos.length === 1 ? '' : 's'} · ${equipos.length} equipo${equipos.length === 1 ? '' : 's'}`;
          grid.innerHTML = elegidos.length ? elegidos.map(card).join('') : '<div class="empty">No hay resultados para este equipo.</div>';
        };

        mostrar();
        document.getElementById('updated').textContent = data.actualizado
          ? 'Actualizado: ' + new Date(data.actualizado).toLocaleString('es-ES')
          : '';
      } catch (error) {
        conteo.textContent = 'No se pudieron cargar los resultados';
        grid.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
      }
    }

    cargar();
  </script>
</body>
</html>
