<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F1D33" />
  <title>HA Basket — Resultados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#0F1D33; --yellow:#F7D10C; --bg:#fff; --card:#f6f7f9; --border:#e2e4e8; --muted:#6b7280; --green:#087443; --red:#b42318; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; color:var(--navy); background:var(--bg); font-family:Barlow,Arial,sans-serif; }
    header { max-width:1120px; margin:auto; padding:18px clamp(20px,5vw,72px); display:flex; justify-content:space-between; align-items:center; gap:18px; border-bottom:1px solid var(--border); }
    .brand { display:flex; align-items:center; gap:10px; color:var(--navy); font:26px 'Bebas Neue',sans-serif; letter-spacing:2px; }
    .club-crest { width:40px; height:40px; flex:none; object-fit:contain; }
    .brand-name .highlight { color:var(--yellow); -webkit-text-stroke:1px var(--navy); }
    nav { display:flex; gap:18px; flex-wrap:wrap; }
    nav a { color:var(--navy); text-decoration:none; font:700 13px 'Barlow Condensed',sans-serif; letter-spacing:1px; text-transform:uppercase; }
    nav a[aria-current="page"] { border-bottom:2px solid var(--yellow); padding-bottom:4px; }
    .hero { border-bottom:3px solid var(--yellow); }
    .hero-inner, main, footer { max-width:1120px; margin:auto; padding-left:clamp(20px,5vw,72px); padding-right:clamp(20px,5vw,72px); }
    .hero-inner { padding-top:42px; padding-bottom:32px; }
    .eyebrow, .section-label { color:var(--muted); font:700 12px 'Barlow Condensed',sans-serif; letter-spacing:3px; text-transform:uppercase; }
    h1 { margin-top:8px; color:var(--navy); font:clamp(48px,8vw,76px)/.95 'Bebas Neue',sans-serif; }
    h1 em { color:var(--yellow); font-style:normal; }
    main { padding-top:32px; padding-bottom:48px; }
    .summary { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
    .stats { color:var(--muted); font-size:14px; }
    .team-filter { position:relative; min-width:220px; }
    .filter-trigger { width:100%; min-height:44px; padding:6px 12px; display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:6px; color:var(--navy); background:#fff; font:600 15px Barlow,sans-serif; text-align:left; cursor:pointer; }
    .filter-trigger::after { content:'⌄'; margin-left:auto; font-size:18px; }
    .filter-trigger:focus-visible, .filter-option:focus-visible { outline:3px solid #315ca8; outline-offset:2px; }
    .filter-trigger .club-crest { width:30px; height:30px; }
    .filter-menu { position:absolute; z-index:5; top:calc(100% + 4px); left:0; right:0; max-height:280px; overflow:auto; padding:4px; border:1px solid var(--border); border-radius:7px; background:#fff; box-shadow:0 8px 24px #0f1d3326; }
    .team-filter:not([open]) .filter-menu { display:none; }
    .filter-option { width:100%; padding:7px 8px; display:flex; align-items:center; gap:10px; border:0; border-radius:4px; color:var(--navy); background:#fff; font:600 14px Barlow,sans-serif; text-align:left; cursor:pointer; }
    .filter-option:hover, .filter-option[aria-selected="true"] { background:#f0f2f6; }
    .filter-option .club-crest { width:28px; height:28px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr)); gap:14px; }
    .result { overflow:hidden; border:1px solid var(--border); border-radius:10px; background:var(--card); animation:appear .35s both; }
    .result-top { padding:13px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; border-bottom:1px solid var(--border); }
    .category { color:var(--muted); font:700 12px 'Barlow Condensed',sans-serif; letter-spacing:.7px; text-transform:uppercase; }
    .round { margin-top:3px; color:var(--navy); font:600 14px 'Barlow Condensed',sans-serif; }
    .date { flex:none; color:var(--muted); font:700 13px 'Barlow Condensed',sans-serif; }
    .match { padding:17px 16px 14px; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:12px; }
    .team-block { min-width:0; display:flex; align-items:center; gap:9px; }
    .team-block.local { justify-content:flex-end; }
    .team-block.visitor { justify-content:flex-start; }
    .team-name { font:700 18px/1.1 'Barlow Condensed',sans-serif; overflow-wrap:anywhere; }
    .team-block.local .team-name { text-align:right; }
    .team-logo { width:40px; height:40px; flex:none; object-fit:contain; border-radius:50%; background:#fff; }
    .score { display:flex; align-items:center; gap:8px; padding:8px 11px; border-radius:7px; background:var(--navy); color:white; font:700 25px/1 'Barlow Condensed',sans-serif; white-space:nowrap; }
    .colon { opacity:.55; font-size:19px; }
    .badge { margin:0 16px 16px; display:inline-block; padding:4px 9px; border-radius:99px; background:#e8eaee; color:var(--muted); font:700 11px 'Barlow Condensed',sans-serif; letter-spacing:.7px; text-transform:uppercase; }
    .badge.victoria { background:#d9f4e7; color:var(--green); }
    .badge.derrota { background:#fde4e2; color:var(--red); }
    .badge.empate { background:#fff3c4; color:#805b00; }
    .empty { grid-column:1/-1; padding:32px 18px; border:1px dashed var(--border); border-radius:10px; color:var(--muted); text-align:center; }
    footer { padding-top:18px; padding-bottom:24px; display:flex; justify-content:space-between; gap:16px; border-top:1px solid var(--border); color:var(--muted); font-size:12px; }
    @keyframes appear { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @media(max-width:560px) { header { align-items:flex-start; flex-direction:column; } .summary { align-items:stretch; flex-direction:column; } .team-filter { width:100%; } .match { gap:7px; padding:14px 10px 12px; } .team-block { gap:5px; } .team-name { font-size:16px; } .team-logo { width:30px; height:30px; } .score { gap:6px; padding:8px; font-size:22px; } footer { flex-direction:column; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><img class="club-crest" src="https://www.fbm.es/imagenes/clubes/20677/logo.jpg" alt="Escudo de Highstep Academy"><span class="brand-name">HA <span class="highlight">BASKET</span></span></div>
    <nav aria-label="Fuente de resultados">
      <a href="https://www.fbm.es/resultados-club-20677/highstep-academy" target="_blank" rel="noopener noreferrer">Fuente FBM ↗</a>
    </nav>
  </header>
  <section class="hero">
    <div class="hero-inner">
      <div class="eyebrow">Temporada de competición</div>
      <h1>HA BASKET<br><em>RESULTADOS</em></h1>
    </div>
  </section>
  <main>
    <div class="summary">
      <div>
        <div class="section-label">Marcadores oficiales</div>
        <div class="stats" id="conteo" aria-live="polite">Cargando resultados…</div>
      </div>
      <label>
        <span class="section-label" style="display:block;margin-bottom:6px">Equipo</span>
        <details class="team-filter" id="filtro-equipo">
          <summary class="filter-trigger" aria-label="Filtrar por equipo"><img class="club-crest" src="https://www.fbm.es/imagenes/clubes/20677/logo.jpg" alt=""><span id="equipo-seleccionado">Todos los equipos</span></summary>
          <div class="filter-menu" id="opciones-equipo" role="listbox" aria-label="Equipos"></div>
        </details>
      </label>
    </div>
    <div class="grid" id="resultados" aria-live="polite"></div>
  </main>
  <footer>
    <span>HA Basket · Highstep Academy</span>
    <span id="updated"></span>
  </footer>
  <script>
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const dateSort = (value) => { const [d,m,y] = value.split('/').map(Number); return new Date(y,m-1,d).getTime(); };
    const escudosFBM = {
      'HA BASKET': '20677', 'HA BASKET "A"': '20677', 'LOS NEGRALES´22': '20674',
      'YELMO TEAM C.D.E.': '20678', 'COLMENAR VIEJO C': '6881', 'REVOLUTION': '16063',
      'PSB PIRATAS': '13330', 'BALONCESTO DAGANZO 12 ISUZU REVEIN': '17760',
      'BALONCESTO SAN FERNANDO': '6283', 'VALLEKAS BASKET C': '20525', 'CDEBSMV NEGRO': '19201',
      'TRIPLE CHAMBERI': '20012', 'VILLAVICIOSA DE ODON A.B.': '6337', 'ONDA VERDE': '12493'
    };
    const escudoEquipo = (result, side) => result[`escudo${side}`]
      || (escudosFBM[result[side === 'Local' ? 'equipoLocal' : 'equipoVisitante']]
        ? `https://www.fbm.es/imagenes/clubes/${escudosFBM[result[side === 'Local' ? 'equipoLocal' : 'equipoVisitante']]}/logo.jpg`
        : '');
    const equipoFilterKey = (result) => JSON.stringify([result.equipoHA, result.categoria]);
    function equipoFilterLabel(result) {
      const category = result.categoria || '';
      const level = /^(Junior|Cadete|Infantil)/i.exec(category)?.[1]
        || (/^2ª\s*Div/i.test(category) ? 'Senior' : category);
      return `${result.equipoHA} · ${level}`;
    }

    function card(result, index) {
      const logo = (src, name) => src ? `<img class="team-logo" src="${esc(src)}" alt="Escudo de ${esc(name)}" loading="lazy" onerror="this.hidden=true">` : '';
      return `<article class="result" style="animation-delay:${Math.min(index,12)*35}ms">
        <div class="result-top"><div><div class="category">${esc(result.categoria)}</div><div class="round">${esc(result.jornada || 'Jornada')}</div></div><time class="date">${esc(result.fecha)}</time></div>
        <div class="match"><div class="team-block local"><span class="team-name">${esc(result.equipoLocal)}</span>${logo(escudoEquipo(result,'Local'),result.equipoLocal)}</div><div class="score"><span>${esc(result.puntosLocal)}</span><span class="colon">:</span><span>${esc(result.puntosVisitante)}</span></div><div class="team-block visitor">${logo(escudoEquipo(result,'Visitante'),result.equipoVisitante)}<span class="team-name">${esc(result.equipoVisitante)}</span></div></div>
        <span class="badge ${esc(result.balance)}">${esc(result.equipoHA)} · ${esc(result.balance)}</span>
      </article>`;
    }

    async function cargar() {
      const grid = document.getElementById('resultados');
      const conteo = document.getElementById('conteo');
      try {
        const response = await fetch('./public/resultados.json?t=' + Date.now());
        if (!response.ok) throw new Error('No se pudo leer el archivo de resultados.');
        const data = await response.json();
        const resultados = [...(data.resultados || [])].sort((a,b) => dateSort(b.fecha) - dateSort(a.fecha));
        const equipos = [...new Map(resultados.map(result => [
          equipoFilterKey(result),
          { value: equipoFilterKey(result), label: equipoFilterLabel(result) }
        ])).values()].sort((a,b) => a.label.localeCompare(b.label,'es'));
        const filtro = document.getElementById('filtro-equipo');
        const opciones = document.getElementById('opciones-equipo');
        const etiquetaSeleccionada = document.getElementById('equipo-seleccionado');
        const escudo = 'https://www.fbm.es/imagenes/clubes/20677/logo.jpg';
        const opcionesFiltro = [{value:'', label:'Todos los equipos'}, ...equipos];
        opciones.innerHTML = opcionesFiltro.map(equipo => `<button class="filter-option" type="button" role="option" aria-selected="${equipo.value === ''}" data-value="${esc(equipo.value)}"><img class="club-crest" src="${escudo}" alt=""><span>${esc(equipo.label)}</span></button>`).join('');
        let valorFiltro = '';
        opciones.addEventListener('click', event => {
          const opcion = event.target.closest('.filter-option');
          if (!opcion) return;
          valorFiltro = opcion.dataset.value;
          etiquetaSeleccionada.textContent = opcionesFiltro.find(equipo => equipo.value === valorFiltro)?.label || 'Todos los equipos';
          opciones.querySelectorAll('.filter-option').forEach(item => item.setAttribute('aria-selected', String(item === opcion)));
          filtro.open = false;
          mostrar();
        });
        document.addEventListener('click', event => { if (!filtro.contains(event.target)) filtro.open = false; });
        filtro.addEventListener('keydown', event => {
          if (event.key === 'Escape') { filtro.open = false; filtro.querySelector('summary').focus(); }
        });

        const mostrar = () => {
          const elegidos = resultados.filter(r => !valorFiltro || equipoFilterKey(r) === valorFiltro);
          conteo.textContent = `${elegidos.length} resultado${elegidos.length === 1 ? '' : 's'} · ${equipos.length} equipo${equipos.length === 1 ? '' : 's'}`;
          grid.innerHTML = elegidos.length ? elegidos.map(card).join('') : '<div class="empty">No hay resultados para este equipo.</div>';
        };

        mostrar();
        document.getElementById('updated').textContent = data.actualizado
          ? 'Actualizado: ' + new Date(data.actualizado).toLocaleString('es-ES')
          : '';
      } catch (error) {
        conteo.textContent = 'No se pudieron cargar los resultados';
        grid.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
      }
    }

    cargar();
  </script>
</body>
</html>
